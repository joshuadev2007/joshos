name: Compilar JoshOS (Android APK y Windows EXE)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools'}
      - name: Instalar SDK Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Instalar dependencias
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Preparar todos los módulos
        run: node native/prepare.mjs mobile
      - name: Puente de respaldos
        working-directory: mobile
        run: npx esbuild native-bridge-src.js --bundle --minify --format=iife --platform=browser --outfile=www/native-bridge.js
      - name: Lector PDF integrado en Bitácora
        working-directory: mobile
        run: |
          npx esbuild pdf-module-src.js --bundle --format=esm --platform=browser --outfile=www/modules/fe/lector-pdf.mjs
          cp node_modules/pdfjs-dist/build/pdf.worker.min.mjs www/modules/fe/pdf.worker.min.mjs
      - name: Crear Android
        working-directory: mobile
        run: npx cap add android
      - name: Generar ícono personalizado Android
        working-directory: mobile
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0b101c' --iconBackgroundColorDark '#0b101c' --splashBackgroundColor '#0b101c'
        continue-on-error: true
      - name: Sincronizar
        working-directory: mobile
        run: npx cap sync android
      - name: Compilar APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: JoshOS-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
  windows:
    name: Windows EXE
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Instalar dependencias
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Preparar todos los módulos
        run: node native/prepare.mjs desktop
      - name: Lector PDF integrado en Bitácora
        working-directory: desktop
        run: |
          npx esbuild pdf-module-src.js --bundle --format=esm --platform=browser --outfile=www/modules/fe/lector-pdf.mjs
          Copy-Item node_modules/pdfjs-dist/build/pdf.worker.min.mjs www/modules/fe/pdf.worker.min.mjs
      - name: Compilar Windows
        working-directory: desktop
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: JoshOS-Windows-EXE
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
