<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1528"><title>Penalty Legends · JoshOS</title>
<style>
:root{color-scheme:dark;--bg:#0c1528;--panel:#141f33;--border:#334b67;--lime:#b8ed80;--text:#e6effb;--muted:#9eb1c6;--rose:#fa8c87}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#223a4b,#0c1528 76%);font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:var(--text)}.wrap{max-width:900px;margin:auto;padding:15px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:21px;margin:0}p{color:var(--muted);font-size:12px}button,select,input{font:inherit}button{border:1px solid var(--border);background:#263853;color:var(--text);border-radius:12px;padding:9px 13px;cursor:pointer}button:hover,button:focus-visible{border-color:var(--lime);outline:none}button:disabled{opacity:.5;cursor:wait}.cta{background:var(--lime);color:#152313;border-color:var(--lime);font-weight:900}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.stat{background:var(--panel);padding:10px;border:1px solid var(--border);border-radius:12px;text-align:center}.stat b{font-size:24px;display:block}.stat span{font-size:10px;color:var(--muted)}.pitch{position:relative;overflow:hidden;border:3px solid #4a6b6a;border-radius:18px;height:315px;background:repeating-linear-gradient(0deg,#1c623c 0 40px,#1b6c40 40px 80px)}.pitch:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at top,#ffffff17,transparent 60%),linear-gradient(180deg,#071423dd 0%,transparent 29%);pointer-events:none}.line{position:absolute;border:2px solid #e9fff681;left:7%;right:7%;top:4%;height:65%;border-radius:0 0 80px 80px}.goal{position:absolute;left:17%;width:66%;top:11%;height:37%;border:6px solid #eef7ff;border-bottom:2px solid #dce8f2;box-shadow:0 0 16px #fff8;background:repeating-linear-gradient(0deg,transparent 0 18px,#f3ffff33 19px 20px),repeating-linear-gradient(90deg,transparent 0 18px,#f3ffff33 19px 20px)}.keeper{position:absolute;z-index:3;left:50%;top:21%;width:48px;height:76px;transform:translate(-50%,0);transition:transform .65s ease}.keeper .head{width:20px;height:20px;border-radius:50%;background:#f6c88f;margin:auto;border:2px solid #583c39}.keeper .shirt{margin:auto;width:31px;height:35px;border-radius:12px 12px 5px 5px;background:#d92a4a;border:2px solid #fff;position:relative}.keeper .shirt:before,.keeper .shirt:after{content:"";position:absolute;top:6px;width:25px;height:9px;border-radius:8px;background:#f0bb90}.keeper .shirt:before{right:26px;transform:rotate(-30deg)}.keeper .shirt:after{left:26px;transform:rotate(30deg)}.keeper .legs{width:23px;height:21px;margin:auto;background:linear-gradient(90deg,#0e1322 0 40%,transparent 40% 60%,#0e1322 60%);border-radius:0 0 7px 7px}.keeper.left{transform:translate(calc(-50% - 125px),5px) rotate(-38deg)}.keeper.right{transform:translate(calc(-50% + 125px),5px) rotate(38deg)}.keeper.center{transform:translate(-50%,-6px)}.ball{z-index:4;position:absolute;left:50%;top:85%;width:33px;height:33px;transform:translate(-50%,0);border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#d9e4f1 75%);border:2px solid #18243c;box-shadow:0 5px 11px #082c1a99;transition:left .8s cubic-bezier(.2,.6,.2,1),top .8s cubic-bezier(.2,.6,.2,1),transform .8s}.ball:after{content:'⬟';color:#1a2230;font-size:17px;position:absolute;left:8px;top:3px}.ball.fly{top:31%;transform:translate(-50%,-30%) scale(.5) rotate(360deg)}.target{position:absolute;top:11%;height:37%;width:22%;cursor:pointer;z-index:5;background:transparent;border:0}.target:hover,.target:focus-visible{background:#bdff6b28}.target.selected{background:#bdf48322;outline:2px dashed #b8ed80;outline-offset:-5px}.target-left{left:17%}.target-mid{left:39%}.target-right{left:61%}.message{min-height:46px;text-align:center;font-size:20px;font-weight:800;padding:10px}.controls{background:#141f33;border:1px solid var(--border);border-radius:16px;margin-top:12px;padding:14px}.ctrl-row{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:10px;justify-content:center}.chosen{color:var(--lime);font-weight:800}.power{display:flex;align-items:center;gap:7px}.power input{accent-color:var(--lime);max-width:120px}select{background:#263853;color:#e6effb;border:1px solid var(--border);border-radius:9px;padding:8px}.note{text-align:center;font-size:11px;margin:8px 0 0}.status{color:var(--lime)}@media(max-width:590px){.pitch{height:270px}.goal{width:76%;left:12%}.target-left{left:12%}.target-mid{left:38%}.target-right{left:64%}.target{width:26%}.keeper.left{transform:translate(calc(-50% - 75px),5px) rotate(-38deg)}.keeper.right{transform:translate(calc(-50% + 75px),5px) rotate(38deg)}h1{font-size:19px}.wrap{padding:8px}.stat b{font-size:20px}}
</style></head><body><div class="wrap"><header><div><h1>⚽ Penalty Legends</h1><p>Tu estadio personal · Controles táctiles y teclado</p></div><label>Dificultad <select id="difficulty"><option value="normal">Normal</option><option value="media">Media</option><option value="dificil">Difícil</option><option value="imposible">Imposible</option></select></label></header><div class="stats"><div class="stat"><b id="goals">0</b><span>GOLES</span></div><div class="stat"><b id="shots">0</b><span>TIROS</span></div><div class="stat"><b id="streak">0</b><span>RACHA</span></div><div class="stat"><b id="best">0</b><span>RÉCORD</span></div></div><div class="pitch" role="group" aria-label="Seleccioná izquierda, centro o derecha para apuntar"><div class="line"></div><div class="goal"></div><div class="keeper" id="keeper"><div class="head"></div><div class="shirt"></div><div class="legs"></div></div><div id="ball" class="ball"></div><button class="target target-left" data-dir="left" aria-label="Apuntar a la izquierda"></button><button class="target target-mid selected" data-dir="center" aria-label="Apuntar al centro"></button><button class="target target-right" data-dir="right" aria-label="Apuntar a la derecha"></button></div><div class="message" id="message" aria-live="polite">Elegí dónde patear ⚽</div><div class="controls"><div class="ctrl-row"><button data-dir="left">← Izquierda</button><button class="chosen" data-dir="center">↑ Centro</button><button data-dir="right">Derecha →</button><label class="power">Potencia <input id="power" type="range" min="15" max="100" value="70"><output id="pow">70%</output></label><button id="shoot" class="cta">⚽ ¡PATEAR!</button><button id="reset">Reiniciar</button></div><p class="note">Teclas ← ↑ → para apuntar · Espacio para patear · Un tiro con potencia extrema puede irse por arriba.</p></div></div><script>
(()=>{'use strict';const key='joshos-penalty-legends-v1',$=id=>document.getElementById(id);let stats;try{stats=JSON.parse(localStorage.getItem(key)||'{}')}catch{stats={}}stats={shots:0,goals:0,streak:0,best:0,...stats};let chosen='center',busy=false;
function render(){for(const k of ['shots','goals','streak','best'])$(k).textContent=stats[k];document.querySelectorAll('[data-dir]').forEach(n=>{const yes=n.dataset.dir===chosen;n.classList.toggle('selected',yes);if(n.tagName==='BUTTON'&&!n.classList.contains('target'))n.classList.toggle('chosen',yes)});$('pow').textContent=$('power').value+'%';try{localStorage.setItem(key,JSON.stringify(stats))}catch{}}
function select(x){if(busy)return;chosen=x;render()};document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.dir)));$('power').addEventListener('input',render);
function shoot(){if(busy)return;busy=true;$('shoot').disabled=true;const power=+$('power').value,diff=$('difficulty').value,p={normal:.29,media:.46,dificil:.66,imposible:.86}[diff];const dirs=['left','center','right'];const ball=$('ball'),keeper=$('keeper');let goalie=dirs[Math.floor(Math.random()*3)];if(Math.random()<p)goalie=chosen;let missed=power>=94&&Math.random()<.24;let save=goalie===chosen&&Math.random()<(.35+p*.65);const goal=!missed&&!save;ball.style.left=({left:'28%',center:'50%',right:'72%'})[chosen];ball.classList.add('fly');keeper.className='keeper '+goalie;stats.shots++;if(goal){stats.goals++;stats.streak++;stats.best=Math.max(stats.best,stats.streak)}else stats.streak=0;$('message').textContent=missed?'¡SE FUE POR ARRIBA! 😮':goal?'¡¡¡GOOOOOOL!!! 🔥':'¡ATAJÓ EL PORTERO! 🧤';$('message').className='message '+(goal?'status':'');render();setTimeout(()=>{ball.classList.remove('fly');ball.style.left='50%';keeper.className='keeper';busy=false;$('shoot').disabled=false},970)}$('shoot').addEventListener('click',shoot);$('reset').addEventListener('click',()=>{if(!confirm('¿Reiniciar las estadísticas de tus penales?'))return;stats={shots:0,goals:0,streak:0,best:stats.best};$('message').textContent='¡Nueva tanda!';render()});document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;const map={ArrowLeft:'left',ArrowUp:'center',ArrowRight:'right'};if(map[e.code]){e.preventDefault();select(map[e.code])}else if(e.code==='Space'){e.preventDefault();shoot()}});render()})();
</script></body></html>
